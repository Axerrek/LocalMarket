{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
    <title>LocalMarket</title>

    <!-- CSS globalny -->
    <link rel="stylesheet" href="{% static 'css/ads.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/chat.css' %}">
    <link rel="stylesheet" href="{% static 'css/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/messages.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body>

    <header class="navbar">
    <div class="navbar__inner">
        <!-- Logo -->
        <div class="navbar__logo">LocalMarket</div>

        <!-- Nawigacja -->
        <nav class="navbar__nav">
            <a href="{% url 'ads_list' %}">Ogłoszenia</a>

            {% if user.is_authenticated %}
                <span class="navbar__user">Witaj, {{ user.username }}!</span>
                <a href="{% url 'chat_list' %}">Czaty</a>

                <!-- Wylogowanie -->
                <form method="POST" action="{% url 'account_logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="navbar__link-button">Wyloguj</button>
                </form>

                <!-- CTA: Dodaj ogłoszenie -->
                <a href="{% url 'ad_create' %}" class="navbar__cta">Dodaj ogłoszenie</a>
            {% else %}
                <a href="{% url 'account_login' %}">Zaloguj się</a>
                <a href="{% url 'account_signup' %}">Rejestracja</a>
            {% endif %}
        </nav>
    </div>
    </header>
    {% block content %}
    {% endblock %}

    {% block scripts %}
    {% endblock %}
</body>
</html>
