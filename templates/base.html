{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
    <title>LocalMarket</title>

    <!-- CSS globalny -->
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <link rel="stylesheet" href="{% static 'ads/ads.css' %}">
    <link rel="stylesheet" href="{% static 'chat/chat.css' %}">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body>

    <header>
    <div class="container">
        <div class="logo">LocalMarket</div>
        <nav>
        <a href="{% url 'ads_list' %}">Przeglądaj ogłoszenia</a>
        {% if user.is_authenticated %}
            <a>Witaj, {{ user.username }}!</a>
            <a href="{% url 'chat_list' %}">Czaty</a>
            <form method="POST" action="{% url 'account_logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="nav-link-button">Wyloguj</button>
            </form>
            <a href="{% url 'ad_create' %}">Dodaj ogłoszenie</a>
        {% else %}
            <a href="{% url 'account_login' %}">Zaloguj się</a>
            <a href="{% url 'account_signup' %}">Zarejestruj się</a>
        {% endif %}
        </nav>
    </div>
    </header>
    {% block content %}
    {% endblock %}
</body>
</html>
