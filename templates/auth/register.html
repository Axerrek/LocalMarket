{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container">
    <h2>Rejestracja</h2>

    <form method="POST">
        {% csrf_token %}
        <label>Nazwa użytkownika:</label>
        <input type="text" name="username" required>

        <label>Hasło:</label>
        <input type="password" name="password" required>

        <button type="submit">Utwórz konto</button>
    </form>

    <p>Masz już konto? <a href="{% url 'login' %}">Zaloguj się</a></p>
</div>
{% endblock %}
