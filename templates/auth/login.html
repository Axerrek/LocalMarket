{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container">
    <h2>Logowanie</h2>

    <form method="POST">
        {% csrf_token %}
        <label>Nazwa użytkownika:</label>
        <input type="text" name="username" required>

        <label>Hasło:</label>
        <input type="password" name="password" required>

        <button type="submit">Zaloguj</button>
    </form>

    <p>Nie masz konta? <a href="{% url 'register' %}">Zarejestruj się</a></p>
</div>
{% endblock %}
